<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to SkillSprint AI — NovaCart's onboarding intelligence platform">
  <title>Login — SkillSprint AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body { background: var(--gradient-hero); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 2px; height: 2px; background: var(--accent-violet); border-radius: 50%; opacity: 0.4; animation: float linear infinite; }
    @keyframes float {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="particles" aria-hidden="true">
  <div class="particle" style="left:10%;animation-duration:8s;animation-delay:0s;"></div>
  <div class="particle" style="left:25%;animation-duration:12s;animation-delay:2s;"></div>
  <div class="particle" style="left:40%;animation-duration:9s;animation-delay:4s;"></div>
  <div class="particle" style="left:60%;animation-duration:11s;animation-delay:1s;"></div>
  <div class="particle" style="left:75%;animation-duration:7s;animation-delay:3s;"></div>
  <div class="particle" style="left:90%;animation-duration:10s;animation-delay:5s;"></div>
</div>

<div class="login-card animate-fade">
  <div class="login-logo">
    <div class="brand">⚡ SkillSprint AI</div>
    <div class="tagline">NovaCart · Onboarding Intelligence</div>
  </div>

  {% if error %}
  <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/login" id="login-form">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <div class="input-group">
        <span class="input-group-text" style="background:var(--bg-surface);border-color:var(--border);color:var(--text-muted)">
          <i class="bi bi-person"></i>
        </span>
        <input id="username" type="text" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="input-group">
        <span class="input-group-text" style="background:var(--bg-surface);border-color:var(--border);color:var(--text-muted)">
          <i class="bi bi-lock"></i>
        </span>
        <input id="password" type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
    </div>
    <button id="login-btn" type="submit" class="btn btn-primary w-100 btn-lg">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
    </button>
  </form>

  <div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
    <p class="text-muted text-center mb-2" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;">Demo accounts</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <button class="btn btn-outline-light btn-sm demo-btn" data-user="admin" data-pass="admin123">Admin</button>
      <button class="btn btn-outline-light btn-sm demo-btn" data-user="trainer" data-pass="trainer123">Trainer</button>
      <button class="btn btn-outline-light btn-sm demo-btn" data-user="reviewer" data-pass="reviewer123">Reviewer</button>
      <button class="btn btn-outline-light btn-sm demo-btn" data-user="manager" data-pass="manager123">Manager</button>
      <button class="btn btn-outline-light btn-sm demo-btn" data-user="employee" data-pass="employee123">Employee</button>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.demo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('username').value = btn.dataset.user;
    document.getElementById('password').value = btn.dataset.pass;
    document.getElementById('login-form').submit();
  });
});
</script>
</body>
</html>
