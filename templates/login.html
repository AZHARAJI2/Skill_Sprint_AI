<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to SkillSprint AI — NovaCart's onboarding intelligence platform">
  <title>Login — SkillSprint AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-page-wrap">
  <!-- Decorative circles -->
  <div style="position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(15,118,110,0.15);pointer-events:none;"></div>
  <div style="position:absolute;bottom:-100px;left:-60px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none;"></div>

  <div class="login-card animate-fade">
    <div class="login-logo">
      <div class="brand-wrap">
        <div class="brand-icon">S</div>
        <span class="brand">SkillSprint AI</span>
      </div>
      <div class="tagline">NovaCart · Onboarding Intelligence Platform</div>
    </div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" id="login-form">
      <div class="mb-3">
        <label class="form-label" for="username"><i class="bi bi-person me-1"></i>Username</label>
        <input id="username" type="text" name="username" class="form-control"
               placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password"><i class="bi bi-lock me-1"></i>Password</label>
        <div style="position:relative;">
          <input id="password" type="password" name="password" class="form-control"
                 placeholder="Enter your password" autocomplete="current-password" required
                 style="padding-right:2.5rem;">
          <button type="button" onclick="togglePwd()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer;padding:0;">
            <i class="bi bi-eye" id="pwd-eye"></i>
          </button>
        </div>
      </div>
      <button id="login-btn" type="submit" class="btn btn-primary w-100 btn-lg" style="font-size:0.95rem;padding:0.7rem;">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="mt-4 pt-3" style="border-top:1px solid #E2E8F0;">
      <p style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#94A3B8;text-align:center;margin-bottom:0.75rem;">
        Quick Demo Access
      </p>
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button class="btn btn-sm demo-btn" data-user="admin"    data-pass="admin123"
                style="background:#EEF2FF;color:#1E3A5F;border:1px solid #C7D2FE;font-size:0.78rem;">
          <i class="bi bi-shield-check me-1"></i>Admin
        </button>
        <button class="btn btn-sm demo-btn" data-user="trainer"  data-pass="trainer123"
                style="background:#F0FDFA;color:#0F766E;border:1px solid #99F6E4;font-size:0.78rem;">
          <i class="bi bi-mortarboard me-1"></i>Trainer
        </button>
        <button class="btn btn-sm demo-btn" data-user="reviewer" data-pass="reviewer123"
                style="background:#FFFBEB;color:#92400E;border:1px solid #FDE68A;font-size:0.78rem;">
          <i class="bi bi-clipboard-check me-1"></i>Reviewer
        </button>
        <button class="btn btn-sm demo-btn" data-user="manager"  data-pass="manager123"
                style="background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE;font-size:0.78rem;">
          <i class="bi bi-briefcase me-1"></i>Manager
        </button>
        <button class="btn btn-sm demo-btn" data-user="employee" data-pass="employee123"
                style="background:#F1F5F9;color:#475569;border:1px solid #E2E8F0;font-size:0.78rem;">
          <i class="bi bi-person me-1"></i>Employee
        </button>
      </div>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.demo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('username').value = btn.dataset.user;
    document.getElementById('password').value = btn.dataset.pass;
    document.getElementById('login-form').submit();
  });
});
function togglePwd() {
  const inp = document.getElementById('password');
  const eye = document.getElementById('pwd-eye');
  if (inp.type === 'password') { inp.type = 'text'; eye.className = 'bi bi-eye-slash'; }
  else { inp.type = 'password'; eye.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
