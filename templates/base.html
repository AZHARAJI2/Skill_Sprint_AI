"""<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkillSprint AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">SkillSprint AI · NovaCart</a>
    {% if user is defined %}
    <div class="navbar-nav">
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/documents/upload">Documents</a>
      <span class="navbar-text ms-3">{{ user.username }} ({{ user.app_role }})</span>
      <form class="ms-2" method="post" action="/logout"><button class="btn btn-sm btn-outline-light">Logout</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
